<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column;background:#1e1e1e;color:#ddd}

<script>
'use strict';

/* Standalone (APK) mod algÄ±lama â€” script body sonunda olduÄŸu iÃ§in document.body hazÄ±r */
const STANDALONE = !!window.__STANDALONE_MODE;
if(STANDALONE){
  try{document.body.classList.add('standalone');}catch(e){}
}

/* ============================================================
   1) YARDIMCILAR
   ============================================================ */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return String(s).replace(/[&"']/g,c=>({'&':'&amp;','"':'&quot;',"'":'&#39;'}[c]))}
function px(v,def){if(v===undefined||v===null)return def===undefined?null:def;if(typeof v==='number')return v+'px';return v}
function flexAlign(v,def){if(def===undefined)def='flex-start';if(!v)return def;const s=String(v).replace('MainAxisAlignment.','').replace('CrossAxisAlignment.','');return{start:'flex-start',center:'center',end:'flex-end',spaceBetween:'space-between',spaceAround:'space-around',spaceEvenly:'space-evenly',stretch:'stretch',baseline:'baseline'}[s]||def}
function crossAlign(v,def){if(def===undefined)def='center';if(!v)return def;const s=String(v).replace('CrossAxisAlignment.','');return{start:'flex-start',center:'center',end:'flex-end',stretch:'stretch',baseline:'baseline'}[s]||def}

/* ============================================================
   2) SABÄ°TLER
   ============================================================ */
const Colors={blue:'#2196F3',red:'#F44336',green:'#4CAF50',orange:'#FF9800',
  purple:'#9C27B0',pink:'#E91E63',teal:'#009688',grey:'#9E9E9E',black:'#000000',
  white:'#FFFFFF',amber:'#FFC107',indigo:'#3F51B5',cyan:'#00BCD4',lime:'#CDDC39',
  brown:'#795548',yellow:'#FFEB3B',deepPurple:'#673AB7',blueGrey:'#607D8B'};

const ICONS={home:'ğŸ ',search:'ğŸ”',settings:'âš™ï¸',person:'ğŸ‘¤',favorite:'â¤ï¸',star:'â­',
  add:'â•',menu:'â˜°',arrow_back:'â†',arrow_forward:'â†’',check:'âœ“',close:'âœ•',
  info:'â„¹ï¸',warning:'âš ï¸',email:'âœ‰ï¸',phone:'ğŸ“',shopping_cart:'ğŸ›’',notifications:'ğŸ””',
  delete:'ğŸ—‘ï¸',edit:'âœï¸',share:'ğŸ”—',download:'â¬‡ï¸',upload:'â¬†ï¸',camera:'ğŸ“·',
  lock:'ğŸ”’',visibility:'ğŸ‘ï¸',calendar_today:'ğŸ“…',location_on:'ğŸ“',play_arrow:'â–¶ï¸',
  pause:'â¸ï¸',refresh:'ğŸ”„',more_vert:'â‹®',explore:'ğŸ§­',message:'ğŸ’¬',dashboard:'ğŸ“Š',
  send:'â¤',exit_to_app:'â†ª',person_add:'ğŸ‘¥',card_giftcard:'ğŸ',local_offer:'ğŸ·ï¸',
  dark_mode:'ğŸŒ™',light_mode:'â˜€ï¸',palette:'ğŸ¨',save:'ğŸ’¾',cloud:'â˜ï¸',bolt:'âš¡',
  play:'â–¶',stop:'â¹',restart_alt:'â†»',swap_horiz:'â‡„',timer:'â±',trending_up:'ğŸ“ˆ'};
const Icons=ICONS;

const FLUTTER_LOGO_SVG='<svg width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><path fill="#42A5F5" d="M100 0 40 60h60V0z"/><path fill="#42A5F5" d="M40 60v40h60V60H40z"/><path fill="#0D47A1" d="M40 100 100 160v40L40 140v-40z"/><path fill="#1E88E5" d="M100 60v100l60-60-60-40z"/><path fill="#1565C0" d="M100 160l30-30 30 30-30 30-30-30z"/></svg>';

function resolveColor(v,def){
  if(def===undefined)def=null;
  if(!v)return def;
  if(typeof v!=='string')return def;
  if(v==='transparent')return 'transparent';
  if(v.startsWith('#'))return v;
  if(v.startsWith('Theme.of.')){
    const prop=v.slice(9);
    return getThemeColor(prop);
  }
  if(v.startsWith('Colors.')){
    const k=v.slice(7);
    if(Colors[k])return Colors[k];
  }
  return v;
}

function resolveIcon(name){
  if(!name||typeof name!=='string')return '?';
  if(name==='Icons.flutter_dash'||name==='flutter')return 'FLUTTER_LOGO';
  if(name.startsWith('Icons.'))name=name.slice(6);
  return ICONS[name]||name.slice(0,2).toUpperCase();
}

function getThemeColor(prop){
  const dark=STATE.theme==='dark';
  const t={
    primaryColor: dark?'#BB86FC':'#2196F3',
    accentColor: dark?'#03DAC6':'#FF4081',
    backgroundColor: dark?'#121212':'#FAFAFA',
    scaffoldBackgroundColor: dark?'#121212':'#FAFAFA',
    cardColor: dark?'#1E1E1E':'#FFFFFF',
    canvasColor: dark?'#1E1E1E':'#FFFFFF',
    dividerColor: dark?'#2C2C2C':'#E0E0E0',
    errorColor: dark?'#CF6679':'#B00020'
  };
  return t[prop]||(dark?'#E0E0E0':'#212121');
}

/* ============================================================
   3) GLOBAL STATE
   ============================================================ */
const STATE={
  counter:0, toggles:{}, inputs:{}, sliders:{},
  bottomNav:{__main:0}, tabs:{},
  navigator:{stack:['/'], direction:'none'},
  overlay:null, drawer:{open:false}, sheet:{open:false},

};

const PROGRAM={vars:{}, classes:{}, imports:[]};
const SCOPE_STACK=[{}];
const STATEFUL_INSTANCES={};
const ANIM={};

/* ============================================================
   4) PREFS (SharedPreferences benzeri)
   ============================================================ */
const PREFS_PREFIX='flutter_prefs_v1_';
const Prefs={
  _key(k){return PREFS_PREFIX+k},
  _set(k,v,t){try{localStorage.setItem(this._key(k),JSON.stringify({t,v}))}catch(e){}return this},
  _get(k){try{const r=localStorage.getItem(this._key(k));return r?JSON.parse(r):null}catch(e){return null}},
  setInt(k,v){return this._set(k,parseInt(v)||0,'int')},
  setDouble(k,v){return this._set(k,parseFloat(v)||0,'dbl')},
  setString(k,v){return this._set(k,String(v),'str')},
  setBool(k,v){return this._set(k,!!v,'bool')},
  getInt(k,def){const x=this._get(k);return x&&x.t==='int'?x.v:(def===undefined?0:def)},
  getDouble(k,def){const x=this._get(k);return x&&(x.t==='dbl'||x.t==='int')?x.v:(def===undefined?0:def)},
  getString(k,def){const x=this._get(k);return x&&x.t==='str'?x.v:(def===undefined?'':def)},
  getBool(k,def){const x=this._get(k);return x&&x.t==='bool'?x.v:(def===undefined?false:def)},
  remove(k){try{localStorage.removeItem(this._key(k))}catch(e){}return this},
  clear(){try{const keys=Object.keys(localStorage);keys.forEach(k=>{if(k.startsWith(PREFS_PREFIX))localStorage.removeItem(k)})}catch(e){}return this},
  keys(){try{return Object.keys(localStorage).filter(k=>k.startsWith(PREFS_PREFIX)).map(k=>k.slice(PREFS_PREFIX.length))}catch(e){return[]}},
  all(){const o={};this.keys().forEach(k=>{const v=this._get(k);o[k]=v?v.v:null});return o}
};

/* ============================================================
   5) Ä°FADE PARSER (Pratt â€” recursive descent)
   ============================================================ */
function parseExpr(src){
  let i=0;
  const L=src.length;
  const skip=()=>{while(i<L&&/\s/.test(src[i]))i++};

  function parseTernary(){
    const cond=parseOr();
    skip();
    if(src[i]==='?'&&src[i+1]!=='?'){
      i++;
      const t=parseTernary();
      skip();
      if(src[i]===':')i++;
      const f=parseTernary();
      return{t:'?',c:cond,a:t,b:f};
    }
    return cond;
  }
  function parseOr(){
    let l=parseAnd();
    while(true){
      skip();
      if(src[i]==='|'&&src[i+1]==='|'){i+=2;l={t:'||',a:l,b:parseAnd()}}
      else if(src[i]==='?'&&src[i+1]==='?'){i+=2;l={t:'??',a:l,b:parseAnd()}}
      else break;
    }
    return l;
  }
  function parseAnd(){
    let l=parseEq();
    while(true){
      skip();
      if(src[i]==='&'&&src[i+1]==='&'){i+=2;l={t:'&&',a:l,b:parseEq()}}
      else break;
    }
    return l;
  }
  function parseEq(){
    let l=parseCmp();
    while(true){
      skip();
      if(src.slice(i,i+3)==='==='){i+=3;l={t:'===',a:l,b:parseCmp()}}
      else if(src.slice(i,i+3)==='!=='){i+=3;l={t:'!==',a:l,b:parseCmp()}}
      else if(src.slice(i,i+2)==='=='){i+=2;l={t:'==',a:l,b:parseCmp()}}
      else if(src.slice(i,i+2)==='!='){i+=2;l={t:'!=',a:l,b:parseCmp()}}
      else break;
    }
    return l;
  }
  function parseCmp(){
    let l=parseAdd();
    while(true){
      skip();
      if(src.slice(i,i+2)==='<='){i+=2;l={t:'<=',a:l,b:parseAdd()}}
      else if(src.slice(i,i+2)==='>='){i+=2;l={t:'>=',a:l,b:parseAdd()}}
      else if(src[i]==='<'&&src[i+1]!=='<'){i++;l={t:'<',a:l,b:parseAdd()}}
      else if(src[i]==='>'&&src[i+1]!=='>'){i++;l={t:'>',a:l,b:parseAdd()}}
      else break;
    }
    return l;
  }
  function parseAdd(){
    let l=parseMul();
    while(true){
      skip();
      if(src[i]==='+'){i++;l={t:'+',a:l,b:parseMul()}}
      else if(src[i]==='-'&&src[i+1]!=='-'){i++;l={t:'-',a:l,b:parseMul()}}
      else break;
    }
    return l;
  }
  function parseMul(){
    let l=parseUnary();
    while(true){
      skip();
      if(src[i]==='*'){i++;l={t:'*',a:l,b:parseUnary()}}
      else if(src[i]==='/'&&src[i+1]!=='/'){i++;l={t:'/',a:l,b:parseUnary()}}
      else if(src[i]==='%'){i++;l={t:'%',a:l,b:parseUnary()}}
      else break;
    }
    return l;
  }
  function parseUnary(){
    skip();
    if(src[i]==='!'&&src[i+1]!=='='){i++;return{t:'!',e:parseUnary()}}
    if(src[i]==='-'&&src[i+1]!=='-'){i++;return{t:'-',e:parseUnary()}}
    return parsePostfix();
  }
  function parsePostfix(){
    let node=parsePrimary();
    while(true){
      skip();
      if(src[i]==='.'&&/[A-Za-z_]/.test(src[i+1]||'')){
        i++;
        const name=readId();
        skip();
        if(src[i]==='('){
          node={t:'call',callee:{t:'member',obj:node,name},args:readArgs()};
        } else {
          node={t:'member',obj:node,name};
        }
      } else if(src[i]==='('){
        node={t:'call',callee:node,args:readArgs()};
      } else if(src[i]==='['){
        i++;
        const idx=parseTernary();
        skip();
        if(src[i]===']')i++;
        node={t:'index',obj:node,idx};
      } else break;
    }
    return node;
  }
  function readId(){skip();const s=i;while(i<L&&/[A-Za-z0-9_]/.test(src[i]))i++;return src.slice(s,i)}
  function readArgs(){
    i++;
    const args=[];
    skip();
    while(i<L&&src[i]!==')'){
      args.push(parseTernary());
      skip();
      if(src[i]===',')i++;
      skip();
    }
    if(src[i]===')')i++;
    return args;
  }
  function parsePrimary(){
    skip();
    if(/[0-9]/.test(src[i]||'')||(src[i]==='.'&&/[0-9]/.test(src[i+1]||''))){
      const s=i;
      while(i<L&&/[0-9.]/.test(src[i]))i++;
      return{t:'num',v:parseFloat(src.slice(s,i))};
    }
    if(src[i]==='"'||src[i]==="'"){
      const q=src[i];i++;
      const s=i;
      while(i<L&&src[i]!==q){if(src[i]==='\\')i++;i++}
      const v=src.slice(s,i);i++;
      return{t:'str',v};
    }
    if(src[i]==='('){
      i++;
      const e=parseTernary();
      skip();
      if(src[i]===')')i++;
      return e;
    }
    const id=readId();
    if(!id)throw new Error('Beklenmeyen: '+src[i]);
    if(id==='true')return{t:'bool',v:true};
    if(id==='false')return{t:'bool',v:false};
    if(id==='null')return{t:'null'};
    return{t:'id',name:id};
  }
  return parseTernary();
}

function evalAST(node){
  if(!node)return undefined;
  switch(node.t){
    case 'num': return node.v;
    case 'str': return node.v;
    case 'bool': return node.v;
    case 'null': return null;
    case 'id': {
      const n=node.name;
      if(n==='STATE')return STATE;
      if(n==='Colors')return Colors;
      if(n==='Icons')return Icons;
      if(n==='Math')return Math;
      if(n==='Prefs')return Prefs;
      if(n==='ANIM')return ANIM;
      return lookupVar(n);
    }
    case '!': return !evalAST(node.e);
    case '-': return -evalAST(node.e);
    case '+': return (evalAST(node.a)||0)+(evalAST(node.b)||0);
    case '-': return (evalAST(node.a)||0)-(evalAST(node.b)||0);
    case '*': return (evalAST(node.a)||0)*(evalAST(node.b)||0);
    case '/': { const b=evalAST(node.b); return b===0?0:(evalAST(node.a)||0)/b }
    case '%': return (evalAST(node.a)||0)%(evalAST(node.b)||1);
    case '<': return evalAST(node.a)<evalAST(node.b);
    case '>': return evalAST(node.a)>evalAST(node.b);
    case '<=': return evalAST(node.a)<=evalAST(node.b);
    case '>=': return evalAST(node.a)>=evalAST(node.b);
    case '==': return evalAST(node.a)==evalAST(node.b);
    case '!=': return evalAST(node.a)!=evalAST(node.b);
    case '===': return evalAST(node.a)===evalAST(node.b);
    case '!==': return evalAST(node.a)!==evalAST(node.b);
    case '&&': return evalAST(node.a)&&evalAST(node.b);
    case '||': return evalAST(node.a)||evalAST(node.b);
    case '??': { const a=evalAST(node.a); return a!=null?a:evalAST(node.b) }
    case '?': return evalAST(node.c)?evalAST(node.a):evalAST(node.b);
    case 'member': {
      const obj=evalAST(node.obj);
      if(obj==null)return undefined;
      return obj[node.name];
    }
    case 'index': {
      const obj=evalAST(node.obj);
      const idx=evalAST(node.idx);
      if(obj==null)return undefined;
      return obj[idx];
    }
    case 'call': {
      const args=node.args.map(evalAST);
      if(node.callee.t==='member'){
        const obj=evalAST(node.callee.obj);
        if(obj==null)return undefined;
        const fn=obj[node.callee.name];
        if(typeof fn==='function')return fn.apply(obj,args);
        return undefined;
      }
      if(node.callee.t==='id'){
        const name=node.callee.name;
        const fn=lookupVar(name);
        if(typeof fn==='function')return fn.apply(null,args);
        if(name==='String')return String(args[0]);
        if(name==='Number')return Number(args[0]);
        if(name==='parseInt')return parseInt(args[0]);
        if(name==='parseFloat')return parseFloat(args[0]);
        return undefined;
      }
      return undefined;
    }
  }
  return undefined;
}

function pushEnv(env){SCOPE_STACK.push(env)}
function popEnv(){SCOPE_STACK.pop()}
function lookupVar(name){
  for(let i=SCOPE_STACK.length-1;i>=0;i--){
    if(name in SCOPE_STACK[i])return SCOPE_STACK[i][name];
  }
  if(name in PROGRAM.vars)return PROGRAM.vars[name];
  if(name in STATE)return STATE[name];
  return undefined;
}

function evalStr(exprStr){
  try{
    const ast=parseExpr(exprStr);
    return evalAST(ast);
  }catch(e){return undefined}
}

/* ============================================================
   6) INTERPOLASYON
   ============================================================ */
function interp(str){
  if(typeof str!=='string')return str;
  let s=str;
  s=s.replace(/\\\$/g,'\x00');
  s=s.replace(/\$\{\{([\s\S]*?)\}\}/g,(_,expr)=>{
    const v=evalStr(expr.trim());
    return v==null?'':String(v);
  });
  s=s.replace(/\$\{([^}]*)\}/g,(_,expr)=>{
    const v=evalStr(expr.trim());
    return v==null?'':String(v);
  });
  s=s.replace(/\$([A-Za-z_][\w.]*)/g,(_,name)=>{
    const v=evalStr(name);
    return v==null?'':String(v);
  });
  s=s.replace(/\x00/g,'$');
  return s;
}

/* ============================================================
   7) ANA PARSER
   ============================================================ */
function parseProgram(src){
  const P={src,i:0,L:src.length};
  const vars={};
  const classes={};
  const imports=[];
  let widget=null;

  function skipWs(){
    while(P.i<P.L){
      const c=P.src[P.i];
      if(/\s/.test(c)){P.i++;continue}
      if(c==='/'&&P.src[P.i+1]==='/'){while(P.i<P.L&&P.src[P.i]!=='\n')P.i++;continue}
      if(c==='/'&&P.src[P.i+1]==='*'){P.i+=2;while(P.i<P.L-1&&!(P.src[P.i]==='*'&&P.src[P.i+1]==='/'))P.i++;P.i+=2;continue}
      break;
    }
  }

  function isIdStart(c){return /[A-Za-z_]/.test(c||'')}
  function isIdChar(c){return /[A-Za-z0-9_]/.test(c||'')}

  function readIdent(){
    skipWs();
    const s=P.i;
    while(P.i<P.L&&isIdChar(P.src[P.i]))P.i++;
    return P.src.slice(s,P.i);
  }

  function readDotted(){
    skipWs();
    const s=P.i;
    while(P.i<P.L&&/[A-Za-z0-9_.]/.test(P.src[P.i]))P.i++;
    return P.src.slice(s,P.i);
  }

  function readString(){
    skipWs();
    const q=P.src[P.i];P.i++;
    const s=P.i;
    while(P.i<P.L&&P.src[P.i]!==q){
      if(P.src[P.i]==='\\')P.i++;
      P.i++;
    }
    const raw=P.src.slice(s,P.i);
    P.i++;
    return raw.replace(/\\n/g,'\n').replace(/\\t/g,'\t').replace(/\\"/g,'"').replace(/\\'/g,"'").replace(/\\\\/g,'\\');
  }

  function readNumber(){
    skipWs();
    const s=P.i;
    if(P.src[P.i]==='-')P.i++;
    while(P.i<P.L&&/[0-9.]/.test(P.src[P.i]))P.i++;
    return parseFloat(P.src.slice(s,P.i));
  }

  function wordIs(w){
    if(P.i+w.length>P.L)return false;
    if(P.src.substr(P.i,w.length)!==w)return false;
    const after=P.src[P.i+w.length];
    return !after||!/[A-Za-z0-9_]/.test(after);
  }
  function consumeWord(){while(P.i<P.L&&isIdChar(P.src[P.i]))P.i++}

  function readParenContent(){
    P.i++;
    let depth=1;
    const s=P.i;
    while(P.i<P.L&&depth>0){
      const c=P.src[P.i];
      if(c==='"'||c==="'"){
        const q=c;P.i++;
        while(P.i<P.L&&P.src[P.i]!==q){
          if(P.src[P.i]==='\\')P.i++;
          P.i++;
        }
        P.i++;
        continue;
      }
      if(c==='(')depth++;
      else if(c===')'){depth--;if(depth===0)break}
      P.i++;
    }
    const content=P.src.slice(s,P.i);
    P.i++;
    return content;
  }

  function skipBlock(){
    let depth=1;
    P.i++;
    while(P.i<P.L&&depth>0){
      if(P.src[P.i]==='{')depth++;
      else if(P.src[P.i]==='}'){depth--;if(depth===0){P.i++;return}}
      P.i++;
    }
  }

  function parseValue(){
    skipWs();
    if(P.i>=P.L)return null;
    if(wordIs('const')||wordIs('final')){consumeWord();skipWs()}
    if(wordIs('if'))return parseIfExpr();
    if(wordIs('for'))return parseForExpr();
    const c=P.src[P.i];
    if(c==='"'||c==="'")return readString();
    if(c==='[')return parseList();
    if(c==='{')return parseObj();
    if(c&&/[-0-9]/.test(c))return readNumber();
    if(c==='('){
      const save=P.i;
      P.i++;
      const params=[];
      let ok=true;
      skipWs();
      while(P.i<P.L&&P.src[P.i]!==')'){
        if(isIdStart(P.src[P.i])){
          params.push(readIdent());
          skipWs();
          if(P.src[P.i]===','){P.i++;skipWs()}
        } else { ok=false; break }
      }
      if(P.src[P.i]===')')P.i++;
      skipWs();
      if(ok&&P.src[P.i]==='='&&P.src[P.i+1]==='>'){
        P.i+=2;
        return {type:'__lambda',params,body:parseValue()};
      }
      if(ok&&P.src[P.i]==='{'){
        P.i++;
        let depth=1;
        const blockStart=P.i;
        while(P.i<P.L&&depth>0){
          if(P.src[P.i]==='{')depth++;
          else if(P.src[P.i]==='}'){depth--;if(depth===0)break}
          P.i++;
        }
        const blockBody=P.src.slice(blockStart,P.i);
        P.i++;
        const retIdx=blockBody.search(/\breturn\b/);
        let retExpr=null;
        if(retIdx!==-1){
          const sub=parseProgram(blockBody.slice(retIdx+6));
          retExpr=sub.widget;
        }
        return {type:'__lambda',params,body:retExpr};
      }
      P.i=save;
    }
    if(isIdStart(c)){
      const save=P.i;
      const id=readIdent();
      skipWs();
      if(P.src[P.i]==='='&&P.src[P.i+1]==='>'){
        P.i+=2;
        return {type:'__lambda',params:[id],body:parseValue()};
      }
      P.i=save;
    }
    const id=readDotted();
    if(id==='true')return true;
    if(id==='false')return false;
    if(id==='null')return null;
    skipWs();
    if(P.src[P.i]==='('){
      return parseWidget(id);
    }
    if(id==='Theme.of'||id.startsWith('Theme.of')){
      if(P.src[P.i]==='(')readParenContent();
      skipWs();
      if(P.src[P.i]==='.'){
        P.i++;
        const prop=readIdent();
        return 'Theme.of.'+prop;
      }
      return 'Theme.of';
    }
    return id;
  }

  function parseList(){
    P.i++;
    const arr=[];
    skipWs();
    while(P.i<P.L&&P.src[P.i]!==']'){
      skipWs();
      if(wordIs('if'))arr.push(parseIfExpr());
      else if(wordIs('for'))arr.push(parseForExpr());
      else if(P.src.slice(P.i,P.i+3)==='...'){
        P.i+=3;
        arr.push({type:'__spread',expr:parseValue()});
      }
      else arr.push(parseValue());
      skipWs();
      if(P.src[P.i]===','){P.i++;skipWs()}
    }
    if(P.src[P.i]===']')P.i++;
    return arr;
  }

  function parseObj(){
    P.i++;
    const o={};
    skipWs();
    while(P.i<P.L&&P.src[P.i]!=='}'){
      skipWs();
      let k;
      if(P.src[P.i]==='"'||P.src[P.i]==="'")k=readString();
      else k=readIdent();
      skipWs();
      if(P.src[P.i]===':')P.i++;
      o[k]=parseValue();
      skipWs();
      if(P.src[P.i]===','){P.i++;skipWs()}
    }
    if(P.src[P.i]==='}')P.i++;
    return o;
  }

  function parseIfExpr(){
    consumeWord();
    skipWs();
    const cond=readParenContent();
    skipWs();
    const thenB=parseValue();
    skipWs();
    let elseB=null;
    if(wordIs('else')){
      consumeWord();
      skipWs();
      if(wordIs('if'))elseB=parseIfExpr();
      else elseB=parseValue();
    }
    return {type:'__if',cond,then:thenB,else:elseB};
  }

  function parseForExpr(){
    consumeWord();
    skipWs();
    const clause=readParenContent();
    skipWs();
    const body=parseValue();
    if(/\sin\s/.test(clause)){
      const parts=clause.split(/\s+in\s+/);
      const vn=parts[0].replace(/^(var|final|const)\s+/,'').trim();
      return {type:'__forin',varName:vn,iterExpr:parts[1],body};
    }
    const p=clause.split(';').map(s=>s.trim());
    if(p.length===3){
      const im=p[0].match(/(\w+)\s*=\s*(.+)/);
      const um=p[2].match(/(\w+)\s*(\+\+|--|\+=|-=|=)\s*(.*)/);
      return {
        type:'__for',
        initVar:im?im[1]:'i',
        initExpr:im?im[2]:'0',
        cond:p[1],
        update:um?{varName:um[1],op:um[2],val:um[3]||'1'}:null,
        body
      };
    }
    return {type:'__forin',varName:'x',iterExpr:'[]',body};
  }

  function parseWidget(type){
    P.i++;
    const node={type,args:{},pos:[]};
    skipWs();
    while(P.i<P.L&&P.src[P.i]!==')'){
      skipWs();
      const save=P.i;
      const id=readIdent();
      skipWs();
      if(P.src[P.i]===':'){
        P.i++;
        node.args[id]=parseValue();
      } else {
        P.i=save;
        node.pos.push(parseValue());
      }
      skipWs();
      if(P.src[P.i]===','){P.i++;skipWs()}
    }
    if(P.src[P.i]===')')P.i++;
    return node;
  }

  function handleMethodBody(cls,name,bodyStr){
    if(name==='build'){
      const retIdx=bodyStr.search(/\breturn\b/);
      if(retIdx!==-1){
        const sub=parseProgram(bodyStr.slice(retIdx+6));
        if(sub.widget)cls.buildBody=sub.widget;
      }
    } else {
      cls.methods[name]={statements:parseStatements(bodyStr),bodyStr};
    }
  }

  function parseStatements(bodySrc){
    const stmts=[];
    const lines=bodySrc.split(/[;\n]/);
    for(const line of lines){
      const s=line.trim();
      if(!s)continue;
      const ss=s.match(/setState\s*\(\s*\(\s*\)\s*\{([\s\S]*)\}\s*\)/);
      if(ss){
        stmts.push(...parseStatements(ss[1]));
        continue;
      }
      let m=s.match(/^(\w+)\s*\+\+$/);
      if(m){stmts.push({type:'unary',field:m[1],op:'++'});continue}
      m=s.match(/^(\w+)\s*--$/);
      if(m){stmts.push({type:'unary',field:m[1],op:'--'});continue}
      m=s.match(/^(\w+)\s*([+\-]?=)\s*(.+)$/);
      if(m){stmts.push({type:'assign',field:m[1],op:m[2],expr:m[3].trim()});continue}
    }
    return stmts;
  }

  function parseClassBody(className,extendsName){
    const cls={
      name:className,
      extends:extendsName,
      isStatelessWidget:extendsName==='StatelessWidget',
      isStatefulWidget:extendsName==='StatefulWidget',
      isState:extendsName==='State',
      stateClassName:null,
      fields:[],
      methods:{},
      buildBody:null
    };
    P.i++;
    let depth=1;
    while(P.i<P.L&&depth>0){
      skipWs();
      if(P.i>=P.L)break;
      if(P.src[P.i]==='}'){depth--;if(depth===0){P.i++;break}P.i++;continue}
      if(P.src[P.i]==='@'){while(P.i<P.L&&P.src[P.i]!=='\n')P.i++;continue}
      while(wordIs('final')||wordIs('static')||wordIs('const')||wordIs('late')||wordIs('var')){
        consumeWord();
        skipWs();
      }
      const s1=P.i;
      if(!isIdStart(P.src[P.i])){P.i++;continue}
      const w1=readIdent();
      skipWs();
      if(P.src[P.i]==='<'){
        let gd=0;
        while(P.i<P.L){
          if(P.src[P.i]==='<')gd++;
          else if(P.src[P.i]==='>'){gd--;if(gd===0){P.i++;break}}
          P.i++;
        }
        skipWs();
      }
      if(P.src[P.i]==='('){
        if(w1===className){
          const args=readParenContent();
          const selfs=args.match(/this\.(\w+)/g)||[];
          selfs.forEach(f=>{
            const n=f.slice(5);
            if(!cls.fields.find(x=>x.name===n))cls.fields.push({name:n,init:null});
          });
          skipWs();
          if(P.src[P.i]==='{')skipBlock();
          else if(P.src[P.i]===';')P.i++;
          continue;
        }
        const args=readParenContent();
        skipWs();
        if(wordIs('async')){consumeWord();skipWs()}
        if(P.src[P.i]==='{'){
          const bs=P.i+1;
          skipBlock();
          handleMethodBody(cls,w1,P.src.slice(bs,P.i-1));
          continue;
        }
        if(P.src[P.i]==='='&&P.src[P.i+1]==='>'){
          P.i+=2;
          const body=parseValue();
          if(w1==='build')cls.buildBody=body;
          else cls.methods[w1]={statements:[]};
          skipWs();
          if(P.src[P.i]===';')P.i++;
          continue;
        }
        if(P.src[P.i]===';')P.i++;
        cls.methods[w1]={statements:[]};
        continue;
      }
      if(!isIdStart(P.src[P.i])){
        while(P.i<P.L&&P.src[P.i]!==';'&&P.src[P.i]!=='}')P.i++;
        if(P.src[P.i]===';')P.i++;
        continue;
      }
      const w2=readIdent();
      skipWs();
      if(P.src[P.i]==='<'){
        let gd=0;
        while(P.i<P.L){
          if(P.src[P.i]==='<')gd++;
          else if(P.src[P.i]==='>'){gd--;if(gd===0){P.i++;break}}
          P.i++;
        }
        skipWs();
      }
      if(P.src[P.i]==='('){
        const args=readParenContent();
        skipWs();
        if(wordIs('async')){consumeWord();skipWs()}
        if(P.src[P.i]==='{'){
          const bs=P.i+1;
          skipBlock();
          handleMethodBody(cls,w2,P.src.slice(bs,P.i-1));
          continue;
        }
        if(P.src[P.i]==='='&&P.src[P.i+1]==='>'){
          P.i+=2;
          const body=parseValue();
          if(w2==='build')cls.buildBody=body;
          else cls.methods[w2]={statements:[]};
          skipWs();
          if(P.src[P.i]===';')P.i++;
          continue;
        }
        if(P.src[P.i]===';')P.i++;
        cls.methods[w2]={statements:[]};
        continue;
      }
      let init=null;
      if(P.src[P.i]==='='){
        P.i++;
        init=parseValue();
      }
      skipWs();
      if(P.src[P.i]===';')P.i++;
      if(!cls.fields.find(f=>f.name===w2))cls.fields.push({name:w2,init});
    }
    return cls;
  }

  function parseClass(){
    consumeWord();
    skipWs();
    const name=readIdent();
    skipWs();
    let extendsName='';
    let stateWidgetName=null;
    if(wordIs('extends')){
      consumeWord();
      skipWs();
      extendsName=readIdent();
      skipWs();
      if(P.src[P.i]==='<'){
        P.i++;
        stateWidgetName=readIdent();
        skipWs();
        if(P.src[P.i]==='>')P.i++;
      }
    }
    while(wordIs('with')||wordIs('implements')||wordIs('mixin')){
      consumeWord();
      skipWs();
      readIdent();
      skipWs();
    }
    skipWs();
    if(P.src[P.i]!=='{')return;
    const cls=parseClassBody(name,extendsName);
    if(extendsName==='State'&&stateWidgetName)cls.stateClassName=stateWidgetName;
    classes[name]=cls;
  }

  while(P.i<P.L){
    skipWs();
    if(P.i>=P.L)break;

    if(wordIs('import')){
      consumeWord();
      skipWs();
      if(P.src[P.i]==='"'||P.src[P.i]==="'")imports.push(readString());
      skipWs();
      if(P.src[P.i]===';')P.i++;
      continue;
    }

    if(wordIs('library')||wordIs('part')||wordIs('export')){
      while(P.i<P.L&&P.src[P.i]!==';')P.i++;
      if(P.src[P.i]===';')P.i++;
      continue;
    }

    if(wordIs('class')){
      parseClass();
      continue;
    }

    if(wordIs('const')||wordIs('final')){
      consumeWord();
      skipWs();
      const name=readIdent();
      skipWs();
      if(P.src[P.i]==='=')P.i++;
      const val=parseValue();
      skipWs();
      if(P.src[P.i]===';')P.i++;
      vars[name]=val;
      continue;
    }

    if(isIdStart(P.src[P.i])){
      const save=P.i;
      const w1=readIdent();
      skipWs();
      if(P.src[P.i]==='<'){
        let gd=0;
        P.i++;gd=1;
        while(P.i<P.L&&gd>0){
          if(P.src[P.i]==='<')gd++;
          else if(P.src[P.i]==='>'){gd--;if(gd===0)break}
          P.i++;
        }
        if(P.src[P.i]==='>')P.i++;
        skipWs();
      }
      if(isIdStart(P.src[P.i])){
        const w2=readIdent();
        skipWs();
        if(P.src[P.i]==='<'){
          P.i++;
          let gd=1;
          while(P.i<P.L&&gd>0){
            if(P.src[P.i]==='<')gd++;
            else if(P.src[P.i]==='>'){gd--;if(gd===0)break}
            P.i++;
          }
          if(P.src[P.i]==='>')P.i++;
          skipWs();
        }
        if(P.src[P.i]==='('){
          readParenContent();
          skipWs();
          if(wordIs('async')){consumeWord();skipWs()}
          if(P.src[P.i]==='='&&P.src[P.i+1]==='>'){
            P.i+=2;
            const ret=parseValue();
            if(w2==='build'&&ret&&typeof ret==='object'&&ret.type&&!ret.type.startsWith('__'))widget=ret;
            skipWs();
            if(P.src[P.i]===';')P.i++;
            continue;
          }
          if(P.src[P.i]==='{'){
            const bs=P.i+1;
            skipBlock();
            const bodyStr=P.src.slice(bs,P.i-1);
            if(w2==='build'){
              const retIdx=bodyStr.search(/\breturn\b/);
              if(retIdx!==-1){
                const sub=parseProgram(bodyStr.slice(retIdx+6));
                if(sub.widget)widget=sub.widget;
              }
            }
            continue;
          }
          if(P.src[P.i]===';')P.i++;
          continue;
        }
      }
      P.i=save;
    }

    const val=parseValue();
    skipWs();
    if(P.src[P.i]===';')P.i++;
    if(val&&typeof val==='object'&&val.type&&!val.type.startsWith('__')&&val.type!=='__lambda'){
      widget=val;
    }
  }

  return {vars,classes,imports,widget};
}

/* ============================================================
   8) STATE METODU Ã‡ALIÅTIRMA
   ============================================================ */
function runStatements(stmts,inst){
  if(!stmts||!inst)return;
  stmts.forEach(s=>{
    if(s.type==='unary'){
      const cur=inst.fields[s.field];
      const num=typeof cur==='number'?cur:0;
      if(s.op==='++')inst.fields[s.field]=num+1;
      else if(s.op==='--')inst.fields[s.field]=num-1;
    } else if(s.type==='assign'){
      pushEnv(inst.fields);
      let val;
      try{val=evalStr(s.expr)}finally{popEnv()}
      const cur=inst.fields[s.field];
      if(s.op==='=')inst.fields[s.field]=val==null?0:val;
      else if(s.op==='+=')inst.fields[s.field]=(typeof cur==='number'?cur:0)+(typeof val==='number'?val:0);
      else if(s.op==='-=')inst.fields[s.field]=(typeof cur==='number'?cur:0)-(typeof val==='number'?val:0);
    }
  });
}

/* ============================================================
   9) ANÄ°MASYON
   ============================================================ */
function getAnimController(name,duration,initialValue){
  if(ANIM[name])return ANIM[name];
  const ctrl={
    name,
    duration:duration||1000,
    value:initialValue||0,
    _running:false,
    _startTime:0,
    _startValue:0,
    _endValue:0,
    forward(){
      this._running=true;
      this._startTime=performance.now();
      this._startValue=this.value;
      this._endValue=1;
      tickAnimation();
    },
    reverse(){
      this._running=true;
      this._startTime=performance.now();
      this._startValue=this.value;
      this._endValue=0;
      tickAnimation();
    },
    reset(){
      this._running=false;
      this.value=initialValue||0;
      paint();
    },
    stop(){this._running=false}
  };
  ANIM[name]=ctrl;
  return ctrl;
}

function tickAnimation(){
  let anyRunning=false;
  for(const name in ANIM){
    const ctrl=ANIM[name];
    if(ctrl._running){
      const elapsed=performance.now()-ctrl._startTime;
      const t=Math.min(1,elapsed/ctrl.duration);
      ctrl.value=ctrl._startValue+(ctrl._endValue-ctrl._startValue)*t;
      if(t>=1)ctrl._running=false;
      else anyRunning=true;
    }
  }
  if(anyRunning){
    paint();
    requestAnimationFrame(tickAnimation);
  } else {
    paint();
  }
}

/* ============================================================
   10) RENDER
   ============================================================ */
function render(node){
  if(node===null||node===undefined)return '';
  if(typeof node==='string')return esc(interp(node));
  if(typeof node==='number')return String(node);
  if(typeof node==='boolean')return String(node);
  if(Array.isArray(node))return node.map(render).join('');
  if(node.type==='__lambda')return '';
  if(node.type==='__if'){
    let c;
    pushEnv({});
    try{c=evalStr(node.cond)}finally{popEnv()}
    if(c)return render(node.then);
    if(node.else!==null&&node.else!==undefined)return render(node.else);
    return '';
  }
  if(node.type==='__for')return renderFor(node);
  if(node.type==='__forin')return renderForIn(node);
  if(node.type==='__spread'){
    const v=evalStr(node.expr);
    if(Array.isArray(v))return v.map(render).join('');
    return '';
  }
  if(node.type)return renderWidget(node);
  return '';
}

function renderFor(node){
  const env={};
  env[node.initVar]=evalStr(node.initExpr)||0;
  pushEnv(env);
  let html='',iter=0;
  try{
    let cond;
    try{cond=evalStr(node.cond)}catch(e){cond=false}
    while(cond&&iter<500){
      html+=render(node.body);
      if(node.update){
        const cur=env[node.update.varName]||0;
        if(node.update.op==='++')env[node.update.varName]=cur+1;
        else if(node.update.op==='--')env[node.update.varName]=cur-1;
        else if(node.update.op==='+=')env[node.update.varName]=cur+(evalStr(node.update.val)||0);
        else if(node.update.op==='-=')env[node.update.varName]=cur-(evalStr(node.update.val)||0);
        else if(node.update.op==='=')env[node.update.varName]=evalStr(node.update.val);
      }
      iter++;
      try{cond=evalStr(node.cond)}catch(e){cond=false}
    }
  } finally { popEnv() }
  return html;
}

function renderForIn(node){
  const arr=evalStr(node.iterExpr);
  if(!Array.isArray(arr))return '';
  let html='';
  for(const item of arr){
    pushEnv({[node.varName]:item});
    try{html+=render(node.body)}finally{popEnv()}
  }
  return html;
}

function renderWidget(node){
  const cls=PROGRAM.classes[node.type];
  if(cls){
    if(cls.isState)return '';
    if(cls.isStatefulWidget){
      let stateCls=null;
      for(const cn in PROGRAM.classes){
        const c=PROGRAM.classes[cn];
        if(c.isState&&(c.stateClassName===node.type||cn.includes(node.type))){
          stateCls=c;
          break;
        }
      }
      if(!stateCls)return '<div class="f-unknown">âš ï¸ '+esc(node.type)+': State sÄ±nÄ±fÄ± yok</div>';
      let inst=STATEFUL_INSTANCES[node.type];
      if(!inst){
        const fields={};
        for(const f of stateCls.fields){
          if(f.init!=null){
            pushEnv({});
            try{fields[f.name]=evalStr(typeof f.init==='string'?f.init:String(f.init))}finally{popEnv()}
            if(fields[f.name]===undefined)fields[f.name]=f.init;
          } else {
            fields[f.name]=null;
          }
        }
        inst={fields,stateClass:stateCls,widgetArgs:{}};
        STATEFUL_INSTANCES[node.type]=inst;
        if(stateCls.methods['initState']){
          runStatements(stateCls.methods['initState'].statements,inst);
        }
      }
      const env={};
      for(const k in inst.fields)env[k]=inst.fields[k];
      env.__inst=inst;
      env.__widget={};
      for(const k in node.args)env.__widget[k]=node.args[k];
      pushEnv(env);
      try{
        return stateCls.buildBody?render(stateCls.buildBody):'';
      } finally { popEnv() }
    }
    const env={};
    for(const k in node.args)env[k]=node.args[k];
    node.pos.forEach((v,idx)=>{env['_'+idx]=v});
    pushEnv(env);
    try{
      return cls.buildBody?render(cls.buildBody):'';
    } finally { popEnv() }
  }
  const W=WIDGETS[node.type];
  if(!W)return '<div class="f-unknown">âš ï¸ Bilinmeyen: <b>'+esc(node.type)+'</b></div>';
  try{return W(node)}
  catch(e){return '<div class="f-unknown">âš ï¸ '+esc(node.type)+': '+esc(e.message)+'</div>'}
}

  increment:()=>{STATE.counter++},

function handlePress(cmd){
  if(!cmd)return;
  if(cmd.startsWith('toggle:')){
    const k=cmd.slice(7);
    STATE.toggles[k]=!STATE.toggles[k];
    paint();return;
  }
  if(cmd.startsWith('nav:')){
    const parts=cmd.split(':');
    STATE.bottomNav[parts[1]]=parseInt(parts[2]);
    paint();return;
  }
  if(cmd.startsWith('tab:')){
    const parts=cmd.split(':');
    STATE.tabs[parts[1]]=parseInt(parts[2]);
    paint();return;
  }
  if(cmd.startsWith('push:')){
    const snapshot=snapshotHeroes();
    STATE.navigator.stack.push(cmd.slice(5));
    STATE.navigator.direction='push';
    paint({prevHeroes:snapshot});return;
  }
  if(cmd==='pop'){
    if(STATE.navigator.stack.length>1){
      const snapshot=snapshotHeroes();
      STATE.navigator.stack.pop();
      STATE.navigator.direction='pop';
      paint({prevHeroes:snapshot});
    }
    return;
  }
  if(cmd.startsWith('snackbar:')){
    const parts=cmd.slice(9).split('|');
    STATE.overlay={type:'snackbar',message:parts[0]||'',action:parts[1]||''};
    paint();
    if(!parts[1]){
      setTimeout(()=>{
        if(STATE.overlay&&STATE.overlay.type==='snackbar'){
          STATE.overlay=null;paint();
        }
      },3000);
    }
    return;
  }
  if(cmd.startsWith('dialog:')){
    const parts=cmd.slice(7).split('|');
    STATE.overlay={
      type:'dialog',
      title:parts[0]||'',
      message:parts[1]||'',
      confirmLabel:parts[2]||'Tamam',
      confirmCmd:parts[3]||'closeDialog',
      cancelLabel:parts[4]||''
    };
    paint();return;
  }
  if(cmd==='closeDialog'){STATE.overlay=null;paint();return}
  if(cmd.startsWith('anim:')){
    const parts=cmd.split(':');
    const ctrl=ANIM[parts[1]];
    if(ctrl&&typeof ctrl[parts[2]]==='function'){
      ctrl[parts[2]]();
    } else {
      log('âš ï¸ Animasyon: '+cmd,'err');
    }
    return;
  }
  for(const cn in STATEFUL_INSTANCES){
    const inst=STATEFUL_INSTANCES[cn];
    if(inst.stateClass.methods[cmd]){
      runStatements(inst.stateClass.methods[cmd].statements,inst);
      paint();return;
    }
  }
  const m=cmd.match(/^(\w+)\s*(\+\+|--|\+=|-=|=)\s*(.*)$/);
  if(m){
    for(const cn in STATEFUL_INSTANCES){
      const inst=STATEFUL_INSTANCES[cn];
      if(m[1] in inst.fields){
        const cur=inst.fields[m[1]]||0;
        const num=typeof cur==='number'?cur:0;
        if(m[2]==='++')inst.fields[m[1]]=num+1;
        else if(m[2]==='--')inst.fields[m[1]]=num-1;
        else if(m[2]==='+=')inst.fields[m[1]]=num+(parseFloat(m[3])||0);
        else if(m[2]==='-=')inst.fields[m[1]]=num-(parseFloat(m[3])||0);
        else if(m[2]==='='){
          const v=m[3];
          const numV=parseFloat(v);
          inst.fields[m[1]]=isNaN(numV)?v:numV;
        }
        paint();return;
      }
    }
    if(m[1] in STATE){
      const cur=STATE[m[1]]||0;
      if(m[2]==='++')STATE[m[1]]=cur+1;
      else if(m[2]==='--')STATE[m[1]]=cur-1;
      else if(m[2]==='+=')STATE[m[1]]=cur+(parseFloat(m[3])||0);
      else if(m[2]==='-=')STATE[m[1]]=cur-(parseFloat(m[3])||0);
      else if(m[2]==='=')STATE[m[1]]=parseFloat(m[3]);
      paint();return;
    }
  }
  const fn=BUILTIN_COMMANDS[cmd];
  if(fn){fn();paint();return}
  log('âš ï¸ Bilinmeyen komut: "'+cmd+'"','err');
}

window.__press=handlePress;
window.__input=(k,v)=>{STATE.inputs[k]=v};
window.__slider=(k,v,el)=>{
  STATE.sliders[k]=parseFloat(v);
  const l=el.parentElement.querySelector('.slider-val');
  if(l)l.textContent=Math.round(v);
};

function snapshotHeroes(){
  const snap={};
  const heroes=phoneEl.querySelectorAll('[data-hero]');
  const rect=phoneEl.getBoundingClientRect();
  const scale=phoneWrap._scale||1;
  heroes.forEach(h=>{
    const r=h.getBoundingClientRect();
    snap[h.dataset.hero]={
      top:(r.top-rect.top)/scale,
      left:(r.left-rect.left)/scale,
      width:r.width/scale,
      height:r.height/scale
    };
  });
  return snap;
}

function animateHeroes(prev){
  if(!prev)return;
  const heroes=phoneEl.querySelectorAll('[data-hero]');
  const rect=phoneEl.getBoundingClientRect();
  const scale=phoneWrap._scale||1;
  heroes.forEach(h=>{
    const tag=h.dataset.hero;
    if(!prev[tag])return;
    const r=h.getBoundingClientRect();
    const np={
      top:(r.top-rect.top)/scale,
      left:(r.left-rect.left)/scale,
      width:r.width/scale,
      height:r.height/scale
    };
    const old=prev[tag];
    if(Math.abs(old.top-np.top)<2&&Math.abs(old.left-np.left)<2&&Math.abs(old.width-np.width)<2&&Math.abs(old.height-np.height)<2)return;
    const el=h;
    el.style.position='absolute';
    el.style.zIndex='500';
    el.style.top=old.top+'px';
    el.style.left=old.left+'px';
    el.style.width=old.width+'px';
    el.style.height=old.height+'px';
    el.style.transition='none';
    void el.offsetHeight;
    el.style.transition='top .35s cubic-bezier(.4,0,.2,1), left .35s cubic-bezier(.4,0,.2,1), width .35s, height .35s';
    el.style.top=np.top+'px';
    el.style.left=np.left+'px';
    el.style.width=np.width+'px';
    el.style.height=np.height+'px';
    setTimeout(()=>{
      el.style.position='';
      el.style.zIndex='';
      el.style.top='';
      el.style.left='';
      el.style.width='';
      el.style.height='';
      el.style.transition='';
    },380);
  });
}

const FILES_KEY='flutter_files_v9';
let FILES={};
let ACTIVE_FILE='main.dart';

function loadFiles(){
  try{
    const raw=localStorage.getItem(FILES_KEY);
    if(raw){
      FILES=JSON.parse(raw);
      if(!FILES['main.dart'])FILES['main.dart']=PRESETS.counter;
    } else {
      FILES={'main.dart':PRESETS.counter};
    }
  }catch(e){
    FILES={'main.dart':PRESETS.counter};
  }
  if(!FILES[ACTIVE_FILE])ACTIVE_FILE=Object.keys(FILES)[0]||'main.dart';
}

function saveFiles(){
  try{localStorage.setItem(FILES_KEY,JSON.stringify(FILES))}catch(e){}
}

function renderTabs(){
  const bar=document.getElementById('tabs');
  bar.querySelectorAll('.tab').forEach(t=>t.remove());
  const actions=bar.querySelector('.tab-actions');
  Object.keys(FILES).forEach(name=>{
    const tab=document.createElement('div');
    tab.className='tab'+(name===ACTIVE_FILE?' active':'');
    tab.innerHTML='<span>'+esc(name)+'</span>'+(Object.keys(FILES).length>1?'<span class="close" data-name="'+escAttr(name)+'">Ã—</span>':'');
    tab.addEventListener('click',e=>{
      if(e.target.classList.contains('close'))return;
      switchFile(name);
    });
    bar.insertBefore(tab,actions);
  });
  bar.querySelectorAll('.close').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      const name=b.dataset.name;
      if(!confirm(name+' silinsin mi?'))return;
      delete FILES[name];
      if(ACTIVE_FILE===name)ACTIVE_FILE=Object.keys(FILES)[0];
      saveFiles();renderTabs();switchFile(ACTIVE_FILE);
    });
  });
}

function switchFile(name){
  FILES[ACTIVE_FILE]=codeEl.value;
  ACTIVE_FILE=name;
  saveFiles();renderTabs();
  codeEl.value=FILES[name]||'';
  run();
}

function addFile(){
  const name=prompt('Yeni dosya adÄ±:','widgets.dart');
  if(!name||FILES[name])return;
  FILES[name]='// '+name+'\n';
  saveFiles();renderTabs();switchFile(name);
}

const PHONE_W=380,PHONE_H=720,RING=8;
const codeEl=document.getElementById('code');
const logsEl=document.getElementById('logs');
const statusEl=document.getElementById('status');
const presetsEl=document.getElementById('presets');
const previewPane=document.getElementById('preview-pane');
const phoneEl=document.getElementById('phone');
const phoneWrap=document.getElementById('phoneWrap');

let lastAST=null;
let debounce=null;
let saveTimer=null;

function log(msg,cls){
  const d=document.createElement('div');
  if(cls)d.className=cls;
  d.textContent=msg;
  logsEl.appendChild(d);
  logsEl.scrollTop=logsEl.scrollHeight;
  while(logsEl.childElementCount>200)logsEl.removeChild(logsEl.firstChild);
}

function setStatus(t,ok){
  statusEl.textContent=t;
  statusEl.className='status'+(ok===false?' err':'');
}

function showToast(m){
  const t=document.getElementById('toast');
  t.textContent=m;
  t.classList.add('show');
  clearTimeout(t._tt);
  t._tt=setTimeout(()=>t.classList.remove('show'),2000);
}

function fitPhone(){
  if(STANDALONE){phoneWrap._scale=1;return;}
  const aw=previewPane.clientWidth-12;
  const ah=previewPane.clientHeight-12;
  if(aw<=0||ah<=0)return;
  const scale=Math.min(aw/(PHONE_W+RING*2),ah/(PHONE_H+RING*2),1);
  phoneWrap._scale=scale;
  phoneWrap.style.transform='scale('+scale+')';
}

window.addEventListener('resize',fitPhone);
if(window.ResizeObserver)new ResizeObserver(fitPhone).observe(previewPane);

function paint(options){
  options=options||{};
  if(!lastAST)return;
  try{
    ASYNC_ID_STORE.async_counter=0;
    let html=render(lastAST);
    phoneEl.classList.toggle('theme-dark',STATE.theme==='dark');
    html+=renderOverlay(STATE.overlay);
    if(STATE.sheet.open){
      html+='<div class="f-sheet-backdrop" onclick="window.__press(\'closeSheet\')"></div><div class="f-sheet"><div style="text-align:center;font-size:16px;font-weight:600;margin-bottom:12px;color:var(--fg)">SeÃ§enekler</div><div style="display:flex;flex-direction:column;gap:4px"><button class="f-btn text" style="justify-content:flex-start;padding:14px;text-align:left" onclick="window.__press(\'closeSheet\')">ğŸ“·  FotoÄŸraf Ã‡ek</button><button class="f-btn text" style="justify-content:flex-start;padding:14px;text-align:left" onclick="window.__press(\'closeSheet\')">ğŸ–¼ï¸  Galeriden SeÃ§</button></div></div>';
    }
    phoneEl.innerHTML=html;
    fitPhone();
    if(options.prevHeroes){
      requestAnimationFrame(()=>animateHeroes(options.prevHeroes));
    }
    showPrefsRefresh();
  }catch(e){
    log('âœ— Ã‡izim hatasÄ±: '+e.message,'err');
  }
}

function run(){
  FILES[ACTIVE_FILE]=codeEl.value;
  saveFiles();
  const src=codeEl.value;
  if(!src.trim()){setStatus('BoÅŸ',false);return}
  logsEl.innerHTML='';
  try{
    STATE.navigator={stack:['/'],direction:'none'};
    STATE.tabs={};
    STATE.drawer={open:false};
    STATE.sheet={open:false};
    STATE.overlay=null;
    STATE.async={};
    STATE.hasDrawer=false;
    ASYNC_ID_STORE.async_counter=0;
    SCOPE_STACK.length=0;
    SCOPE_STACK.push({});
    PROGRAM.vars={};
    PROGRAM.classes={};
    PROGRAM.imports=[];
    for(const k in STATEFUL_INSTANCES)delete STATEFUL_INSTANCES[k];
    for(const k in ANIM)delete ANIM[k];

    const t0=performance.now();

    const prog=parseProgram(src);
    const imported=[];
    prog.imports.forEach(imp=>{
      const clean=imp.replace(/^\.\//,'');
      if(FILES[clean]&&clean!==ACTIVE_FILE){
        imported.push(clean);
        const sub=parseProgram(FILES[clean]);
        for(const k in sub.vars)PROGRAM.vars[k]=sub.vars[k];
        for(const k in sub.classes)PROGRAM.classes[k]=sub.classes[k];
      }
    });
    for(const k in prog.vars)PROGRAM.vars[k]=prog.vars[k];
    for(const k in prog.classes)PROGRAM.classes[k]=prog.classes[k];

    lastAST=prog.widget;
    const dt=(performance.now()-t0).toFixed(1);

    if(!lastAST){
      log('âš ï¸ Widget bulunamadÄ±. Scaffold/MaterialApp veya build() bekleniyor.','err');
      setStatus('BoÅŸ',false);
      return;
    }
    paint();
    const vc=Object.keys(PROGRAM.vars).length;
    const cc=Object.keys(PROGRAM.classes).length;
    let info='âœ“ Derlendi ('+dt+' ms)';
    if(vc)info+=' â€” '+vc+' deÄŸiÅŸken';
    if(cc)info+=' â€” '+cc+' class';
    if(imported.length)info+=' â€” import: '+imported.join(', ');
    log(info,'ok');
    setStatus('Ã‡alÄ±ÅŸÄ±yor',true);
  }catch(e){
    lastAST=null;
    log('âœ— Hata: '+e.message,'err');
    setStatus('Hata',false);
  }
}

    if(!userCode.trim()){showToast('âš ï¸ Ã–nce kod yaz');return}

    /* 1) Bu dosyanÄ±n kaynak HTML'ini al */
    let selfHtml;
    try{
      const resp=await fetch(location.href,{cache:'no-store'});
      if(!resp.ok)throw new Error('fetch baÅŸarÄ±sÄ±z');
      selfHtml=await resp.text();
    }catch(e){
      /* file:// veya CORS durumunda DOM'dan al */
      selfHtml='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    }

    /* 2) KullanÄ±cÄ± kodunu base64'e Ã§evir (UTF-8 uyumlu) */
    const b64=btoa(unescape(encodeURIComponent(userCode)));

    /* 3) Standalone modda baÅŸlamasÄ± iÃ§in iÅŸaretÃ§ileri enjekte et */
    const marker='<script>window.__STANDALONE_MODE=true;window.__STANDALONE_CODE="'+b64+'";<\/script>';
    selfHtml=selfHtml.replace(/<head([^>]*)>/i,'<head$1>\n'+marker);

    /* 4) PWA manifest ve theme-color linkleri */
    selfHtml=selfHtml.replace(/<head([^>]*)>/i,
      '<head$1>\n<link rel="manifest" href="manifest.json">\n<meta name="theme-color" content="#2196F3">');
    selfHtml=selfHtml.replace(/<\/body>/i,
      '<script>if("serviceWorker" in navigator && location.protocol!=="file:"){navigator.serviceWorker.register("service-worker.js").catch(function(){});}<\/script>\n</body>');

    /* 5) PWA manifesti */
    const manifest={
      name:"Flutter Uygulamam",
      short_name:"FlutterApp",
      start_url:"./index.html",
      scope:"./",
      display:"standalone",
      background_color:"#121212",
      theme_color:"#2196F3",
      orientation:"any",
      icons:[
        {src:"icon-192.png",sizes:"192x192",type:"image/png",purpose:"any maskable"},
        {src:"icon-512.png",sizes:"512x512",type:"image/png",purpose:"any maskable"}
      ]
    };

    /* 6) Service worker */
    const sw=`const CACHE='flutter-app-v1';
const ASSETS=['./','./index.html','./manifest.json','./icon-192.png','./icon-512.png'];
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS).catch(()=>{})));self.skipWaiting()});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim()});
self.addEventListener('fetch',e=>{
  e.respondWith(
    caches.match(e.request).then(r=>r||fetch(e.request).then(resp=>{
      if(resp.ok&&e.request.method==='GET'){
        const copy=resp.clone();
        caches.open(CACHE).then(c=>c.put(e.request,copy)).catch(()=>{});
      }
      return resp;
    }).catch(()=>caches.match('./index.html')))
  );
});`;

    /* 7) Ä°konlar */
    const icon192=await makeIcon(192);
    const icon512=await makeIcon(512);

    /* 8) README ve build_apk.py dosyalarÄ±nÄ± al (varsa) */
    let readme='# Flutter Uygulamam\n\nAPK oluÅŸturma talimatlarÄ± iÃ§in GitHub repo README.md dosyasÄ±na bakÄ±n.\n';
    let pyScript='# build_apk.py â€” GitHub repo kÃ¶kÃ¼ndeki dosyayÄ± kullanÄ±n\n';
    try{
      const r1=await fetch('README.md',{cache:'no-store'});
      if(r1.ok)readme=await r1.text();
    }catch(e){}
    try{
      const r2=await fetch('build_apk.py',{cache:'no-store'});
      if(r2.ok)pyScript=await r2.text();
    }catch(e){}

    /* 9) ZIP oluÅŸtur */
    const zip=new JSZip();
    zip.file('index.html',selfHtml);
    zip.file('manifest.json',JSON.stringify(manifest,null,2));
    zip.file('service-worker.js',sw);
    zip.file('icon-192.png',icon192,{binary:true});
    zip.file('icon-512.png',icon512,{binary:true});
    zip.file('README.md',readme);
    zip.file('build_apk.py',pyScript);

    const blob=await zip.generateAsync({
      type:'blob',
      compression:'DEFLATE',
      compressionOptions:{level:6}
    });

    /* 10) Ä°ndir */
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='flutter-app-apk.zip';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),5000);

    showToast('ğŸ“¦ ZIP indirildi â€” README.md dosyasÄ±nÄ± okuyun');
    log('âœ“ APK paketi hazÄ±r. Ä°Ã§indeki README.md adÄ±mlarÄ±nÄ± takip edin.','ok');
  }catch(e){
    console.error(e);
    showToast('âš ï¸ Hata: '+e.message);
    log('âœ— Export hatasÄ±: '+e.message,'err');
  }
}

/* Canvas ile 512Ã—512 ikon Ã¼ret (SVG yerine) */
async function makeIcon(size){
  return new Promise(resolve=>{
    try{
      const c=document.createElement('canvas');
      c.width=size;c.height=size;
      const ctx=c.getContext('2d');
      /* Arka plan */
      const grad=ctx.createLinearGradient(0,0,size,size);
      grad.addColorStop(0,'#42A5F5');
      grad.addColorStop(1,'#1565C0');
      ctx.fillStyle=grad;
      ctx.fillRect(0,0,size,size);
      /* Flutter logosu â€” basit Ã¼Ã§gen+elmas */
      const s=size/512;
      ctx.fillStyle='rgba(255,255,255,0.95)';
      /* Ãœst Ã¼Ã§gen */
      ctx.beginPath();
      ctx.moveTo(256*s,96*s);
      ctx.lineTo(184*s,168*s);
      ctx.lineTo(328*s,168*s);
      ctx.closePath();
      ctx.fill();
      /* Orta dikdÃ¶rtgen (elmas) */
      ctx.beginPath();
      ctx.moveTo(256*s,180*s);
      ctx.lineTo(340*s,264*s);
      ctx.lineTo(256*s,348*s);
      ctx.lineTo(172*s,264*s);
      ctx.closePath();
      ctx.fill();
      /* Alt kÃ¼Ã§Ã¼k Ã¼Ã§gen */
      ctx.beginPath();
      ctx.moveTo(256*s,360*s);
      ctx.lineTo(316*s,420*s);
      ctx.lineTo(196*s,420*s);
      ctx.closePath();
      ctx.fill();
      c.toBlob(b=>{
        if(!b){resolve(new Uint8Array());return;}
        b.arrayBuffer().then(resolve).catch(()=>resolve(new Uint8Array()));
      },'image/png');
    }catch(e){
      resolve(new Uint8Array());
    }
  });
}

function init(){
  try{
    if(STANDALONE){
      /* APK iÃ§i mod: kod base64'ten gelir, localStorage'dan dosya okuma */
      try{
        const decoded=decodeURIComponent(escape(atob(window.__STANDALONE_CODE||'')));
        FILES={'main.dart':decoded};
      }catch(e){
        FILES={'main.dart':'// Hata: gÃ¶mÃ¼lÃ¼ kod Ã§Ã¶zÃ¼lemedi'};
      }
      ACTIVE_FILE='main.dart';
    } else {
      loadFiles();
      /* URL hash'ten dosya yÃ¼kle */
      if(location.hash.length>4){
        try{
          const hash=location.hash.slice(1);
          if(hash.startsWith('v9=')){
            const bin=atob(hash.slice(3));
            const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
            const json=new TextDecoder().decode(bytes);
            const data=JSON.parse(json);
            if(data.files){
              FILES=data.files;
              ACTIVE_FILE=data.active||Object.keys(data.files)[0];
              saveFiles();
            }
          }
        }catch(e){}
      }
    }
    renderTabs();
    codeEl.value=FILES[ACTIVE_FILE]||PRESETS.counter;
    run();
    requestAnimationFrame(fitPhone);
    setTimeout(fitPhone,100);
    if(STANDALONE){
      log('ğŸ“± APK modunda Ã§alÄ±ÅŸÄ±yor','ok');
    }
  }catch(e){
    log('âœ— BaÅŸlatma: '+e.message,'err');
    setStatus('Hata',false);
    console.error(e);
  }
}
